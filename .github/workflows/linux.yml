name: Snote Linux
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - name: Generate Linux files
        working-directory: app
        run: flutter create --platforms=linux --org=com.snote .
      - name: Verify and build
        working-directory: app
        run: |
          flutter pub get
          dart run launcher_icons
          flutter analyze
          flutter test
          flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: snote-linux
          path: app/build/linux/x64/release/bundle
