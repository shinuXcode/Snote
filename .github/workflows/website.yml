name: Snote Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
