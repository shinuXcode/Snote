name: Rebrand website documentation PDFs

on:
  push:
    branches:
      - agent-fix-the-deployment-95c5
    paths:
      - ".github/workflows/rebrand-docs.yml"
      - "website/scripts/rebrand_pdfs.py"

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF tooling
        run: python -m pip install --disable-pip-version-check PyMuPDF CairoSVG
      - name: Update branding inside the actual PDF files
        run: python website/scripts/rebrand_pdfs.py
      - name: Commit updated PDFs and checksum manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/public/docs/*.pdf website/public/docs/SHA256-MANIFEST.txt
          if git diff --cached --quiet; then
            echo "PDFs are already branded."
          else
            git commit -m "Refresh Snotee branding inside website PDFs"
            git push
          fi
