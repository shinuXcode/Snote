name: Snote CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "website/**"
      - "supabase/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: snote-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Generate Android and Web runners
        working-directory: app
        run: |
          flutter create --platforms=android,web --org=com.snote --no-pub .
          rm -f test/widget_test.dart

      - name: Configure Android SDK and camera permissions
        working-directory: app
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          build = Path('android/app/build.gradle.kts')
          if not build.exists():
            raise SystemExit('Generated Android app Gradle file is missing')
          s = build.read_text()
          s, sdk_matches = re.subn(
            r'(?m)^([ \\t]*)compileSdk[ \\t]*=[ \\t]*(?:flutter\\.compileSdkVersion|\\d+)[ \\t]*
          if p.exists():
            s = p.read_text()
            if 'android.permission.CAMERA' not in s:
              s = s.replace('<manifest ', '<manifest ', 1).replace('>', '>', 1)
              s = s.replace('\n', '\n    <uses-permission android:name="android.permission.CAMERA" />\n', 1)
              p.write_text(s)
          PY

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Clean
        working-directory: app
        run: flutter clean

      - name: Format
        working-directory: app
        run: dart format .

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        working-directory: app
        run: flutter test

      - name: Configure Web SQLite and PDF.js
        working-directory: app
        run: |
          dart run pdfx:install_web

      - name: Build Android APK
        working-directory: app
        run: flutter build apk --release

      - name: Build Web
        working-directory: app
        run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: snote-smoke-builds
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/web
          if-no-files-found: error

  windows:
    name: Windows smoke build
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          cache: true

      - name: Generate Windows runner
        working-directory: app
        shell: bash
        run: |
          flutter create --platforms=windows --org=com.snote --no-pub .
          rm -f test/widget_test.dart

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        working-directory: app
        run: flutter test

      - name: Build Windows
        working-directory: app
        run: flutter build windows --release

  website:
    name: Showcase website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package.json

      - run: npm install
      - run: npm run typecheck
      - run: npm run build
