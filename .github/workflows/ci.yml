            s,
          )
          if sdk_matches != 1:
            raise SystemExit(f'Expected one compileSdk declaration; found {sdk_matches}')
          build.write_text(s)

          settings_candidates = [Path('android/settings.gradle.kts'), Path('android/settings.gradle')]
          settings = next((path for path in settings_candidates if path.exists()), None)
          if settings is None:
            raise SystemExit('Generated Gradle settings file is missing')
          settings_text = settings.read_text()
          plugin_pattern = r'(id\\(["\\']com\\.android\\.application["\\']\\)\\s+version\\s+["\\'])[^"\\']+(["\\'])'
          settings_text, plugin_matches = re.subn(plugin_pattern, r'\\g<1>9.2.0\\2', settings_text, count=1)
          if plugin_matches != 1 and not re.search(r'id\\(["\\']com\\.android\\.application["\\']\\)\\s+version\\s+["\\']9\\.2\\.0["\\']', settings_text):
            raise SystemExit('Could not configure Android Gradle Plugin 9.2.0 for API 37')
          settings.write_text(settings_text)

          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          if not wrapper.exists():
            raise SystemExit('Generated Gradle wrapper properties are missing')
          wrapper_text = wrapper.read_text()
          wrapper_text, wrapper_matches = re.subn(
            r'(gradle-)[0-9.]+-(all|bin)(\\.zip)',
            r'\\g<1>9.4.1-\\g<2>\\g<3>',
            wrapper_text,
            count=1,
          )
          if wrapper_matches != 1 and 'gradle-9.4.1-' not in wrapper_text:
            raise SystemExit('Could not configure Gradle 9.4.1 for Android Gradle Plugin 9.2')
          wrapper.write_text(wrapper_text)

          p = Path('android/app/src/main/AndroidManifest.xml')
          if p.exists():
            s = p.read_text()
            if 'android.permission.CAMERA' not in s:
              s = s.replace('<manifest ', '<manifest ', 1).replace('>', '>', 1)
              s = s.replace('\n', '\n    <uses-permission android:name="android.permission.CAMERA" />\n', 1)
              p.write_text(s)
          PY

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Clean
        working-directory: app
        run: flutter clean

      - name: Format
        working-directory: app
        run: dart format .

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        working-directory: app
        run: flutter test

      - name: Configure Web SQLite and PDF.js
        working-directory: app
        run: |
          dart run pdfx:install_web

      - name: Build Android APK
        working-directory: app
        run: flutter build apk --release

      - name: Build Web
        working-directory: app
        run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: snote-smoke-builds
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/web
          if-no-files-found: error

  windows:
    name: Windows smoke build
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          cache: true

      - name: Generate Windows runner
        working-directory: app
        shell: bash
        run: |
          flutter create --platforms=windows --org=com.snote --no-pub .
          rm -f test/widget_test.dart

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        working-directory: app
        run: flutter test

      - name: Build Windows
        working-directory: app
        run: flutter build windows --release

  website:
    name: Showcase website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package.json

      - run: npm install
      - run: npm run typecheck
      - run: npm run build
