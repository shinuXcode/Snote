name: Snote CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "website/**"
      - "supabase/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: snote-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Generate Android and Web runners
        working-directory: app
        run: |
          flutter create --platforms=android,web --org=com.snote --no-pub .
          rm -f test/widget_test.dart

      - name: Configure and verify Android SDK and camera permissions
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build = Path('android/app/build.gradle.kts')
          if not build.is_file():
              raise SystemExit('Generated Android app/build.gradle.kts is missing')
          lines = build.read_text().splitlines()
          updated = []
          count = 0
          for line in lines:
              stripped = line.strip()
              if stripped.startswith('compileSdk ='):
                  line = line[:len(line) - len(line.lstrip())] + 'compileSdk = 37'
                  count += 1
              updated.append(line)
          if count != 1:
              raise SystemExit(f'Expected one compileSdk assignment, found {count}')
          text = '\n'.join(updated) + '\n'
          if 'compileSdk = 37' not in text:
              raise SystemExit('Android app module is not configured for compileSdk 37')
          build.write_text(text)
          print('Verified Android app module compileSdk=37')

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if manifest.is_file():
              text = manifest.read_text()
              if 'android.permission.CAMERA' not in text:
                  text = text.replace('</manifest>', '    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>')
                  manifest.write_text(text)
          PY

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Clean
        working-directory: app
        run: flutter clean

      - name: Format
        working-directory: app
        run: dart format .

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: app
        run: flutter test --reporter expanded

      - name: Configure Web SQLite and PDF.js
        working-directory: app
        run: dart run pdfx:install_web

      - name: Build Android APK
        working-directory: app
        run: flutter build apk --release

      - name: Build Web
        working-directory: app
        run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: snote-smoke-builds
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/web
          if-no-files-found: error

  windows:
    name: Windows smoke build
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          cache: true

      - name: Generate Windows runner
        working-directory: app
        shell: bash
        run: |
          flutter create --platforms=windows --org=com.snote --no-pub .
          rm -f test/widget_test.dart

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: app
        run: flutter test --reporter expanded

      - name: Build Windows
        working-directory: app
        run: flutter build windows --release

  website:
    name: Showcase website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package.json

      - run: npm install
      - run: npm run typecheck
      - run: npm run build
