name: Snote Apple
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - name: Generate Apple files
        working-directory: app
        run: flutter create --platforms=ios,macos --org=com.snote .
      - name: Set Apple deployment targets
        working-directory: app
        shell: bash
        run: |
          if [ -f ios/Podfile ]; then sed -i '' "s/platform :ios, '12.0'/platform :ios, '13.0'/" ios/Podfile || true; fi
          if [ -f macos/Podfile ]; then sed -i '' "s/platform :osx, '10.14'/platform :osx, '10.15'/" macos/Podfile || true; fi
      - name: Verify and build
        working-directory: app
        run: |
          flutter pub get
          dart run launcher_icons
          flutter analyze
          flutter test
          flutter build macos --release
          flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: snote-macos
          path: app/build/macos/Build/Products/Release
      - uses: actions/upload-artifact@v4
        with:
          name: snote-ios-unsigned
          path: app/build/ios/iphoneos
