name: Snote Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - name: Generate Android platform files
        working-directory: app
        run: flutter create --platforms=android --org=com.snote .
      - name: Set Android minimum SDK
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
          p.write_text(s)
          PY
      - name: Verify and build
        working-directory: app
        run: |
          flutter pub get
          dart run launcher_icons
          flutter analyze
          flutter test
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: snote-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
