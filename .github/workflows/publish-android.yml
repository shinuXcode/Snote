name: Publish Snote Android v0.3.0

on:
  push:
    branches:
      - release/v0.3.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        working-directory: app
        run: flutter create --platforms=android --org=com.snote .

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate launcher icon
        working-directory: app
        run: dart run launcher_icons

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Prepare artifact
        run: cp app/build/app/outputs/flutter-apk/app-release.apk Snote-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: snote-android-v0.3.0
          path: Snote-Android.apk
          if-no-files-found: error

  publish:
    needs: build-android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snote-android-v0.3.0
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.0 dist/Snote-Android.apk \
            --title "Snote v0.3.0" \
            --generate-notes
