name: Snote Release
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: apple
          - os: ubuntu-latest
            target: web
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true

      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev

      - if: matrix.target == 'android'
        working-directory: app
        run: flutter create --platforms=android --org=com.snote .
      - if: matrix.target == 'android'
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
          p.write_text(s)
          PY

      - if: matrix.target == 'linux'
        working-directory: app
        run: flutter create --platforms=linux --org=com.snote .

      - if: matrix.target == 'windows'
        working-directory: app
        run: flutter create --platforms=windows --org=com.snote .

      - if: matrix.target == 'apple'
        working-directory: app
        run: flutter create --platforms=ios,macos --org=com.snote .
      - if: matrix.target == 'apple'
        working-directory: app
        shell: bash
        run: |
          if [ -f ios/Podfile ]; then sed -i '' "s/platform :ios, '12.0'/platform :ios, '13.0'/" ios/Podfile || true; fi
          if [ -f macos/Podfile ]; then sed -i '' "s/platform :osx, '10.14'/platform :osx, '10.15'/" macos/Podfile || true; fi

      - if: matrix.target == 'web'
        working-directory: app
        run: flutter create --platforms=web .

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate app icons
        working-directory: app
        run: dart run launcher_icons

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - if: matrix.target == 'android'
        working-directory: app
        run: flutter build apk --release --dart-define=SUPABASE_URL="${SUPABASE_URL}" --dart-define=SUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY}"
      - if: matrix.target == 'linux'
        working-directory: app
        run: flutter build linux --release --dart-define=SUPABASE_URL="${SUPABASE_URL}" --dart-define=SUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY}"
      - if: matrix.target == 'windows'
        working-directory: app
        run: flutter build windows --release --dart-define=SUPABASE_URL="${SUPABASE_URL}" --dart-define=SUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY}"
      - if: matrix.target == 'apple'
        working-directory: app
        run: |
          flutter build macos --release --dart-define=SUPABASE_URL="${SUPABASE_URL}" --dart-define=SUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY}"
          flutter build ios --release --no-codesign --dart-define=SUPABASE_URL="${SUPABASE_URL}" --dart-define=SUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY}"
      - if: matrix.target == 'web'
        working-directory: app
        run: |
          dart run sqflite_common_ffi_web:setup --force
          flutter build web --release --dart-define=SUPABASE_URL="${SUPABASE_URL}" --dart-define=SUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY}"

      - if: matrix.target == 'android'
        run: cp app/build/app/outputs/flutter-apk/app-release.apk Snote-Android.apk
      - if: matrix.target == 'linux'
        run: tar -czf Snote-Linux.tar.gz -C app/build/linux/x64/release bundle
      - if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath Snote-Windows.zip
      - if: matrix.target == 'apple'
        run: |
          ditto -c -k --sequesterRsrc --keepParent app/build/macos/Build/Products/Release Snote-macOS.zip
          ditto -c -k --sequesterRsrc --keepParent app/build/ios/iphoneos Snote-iOS-unsigned.zip
      - if: matrix.target == 'web'
        run: tar -czf Snote-Web.tar.gz -C app/build web

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            Snote-*.apk
            Snote-*.zip
            Snote-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/Snote-* --generate-notes --title "Snote ${{ github.ref_name }}"
