name: Snote Production Release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "website/**"
      - "supabase/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snote-production-release
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
            artifact: Snote-Android.apk
          - os: ubuntu-latest
            target: linux
            artifact: Snote-Linux.tar.gz
          - os: windows-2022
            target: windows
            artifact: Snote-Windows.zip
          - os: macos-latest
            target: macos
            artifact: Snote-macOS.zip
          - os: macos-latest
            target: ios
            artifact: Snote-iOS-unsigned.zip
          - os: ubuntu-latest
            target: web
            artifact: Snote-Web.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          cache: true

      - name: Setup Linux dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.target != 'web' && matrix.target != 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev libsecret-1-dev

      - name: Generate target runner
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            android)
              flutter create --platforms=android --org=com.snote --no-pub .
              mkdir -p android/app/src/main/kotlin/com/snote/snote
              cp native_android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
              cp native_android/*.kt android/app/src/main/kotlin/com/snote/snote/
              ;;
            linux) flutter create --platforms=linux --org=com.snote --no-pub . ;;
            windows) flutter create --platforms=windows --org=com.snote --no-pub . ;;
            macos) flutter create --platforms=macos --org=com.snote --no-pub . ;;
            ios) flutter create --platforms=ios --org=com.snote --no-pub . ;;
            web) flutter create --platforms=web --no-pub . ;;
          esac
          rm -f test/widget_test.dart

      - name: Configure Android
        if: matrix.target == 'android'
        working-directory: app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          build = Path('android/app/build.gradle.kts')
          lines = build.read_text().splitlines()
          updated = []
          compile_count = 0
          min_count = 0
          for line in lines:
              stripped = line.strip()
              indent = line[:len(line) - len(line.lstrip())]
              if stripped.startswith('compileSdk ='):
                  line = indent + 'compileSdk = 37'
                  compile_count += 1
              elif stripped.startswith('minSdk ='):
                  line = indent + 'minSdk = 24'
                  min_count += 1
              updated.append(line)
          if compile_count != 1 or min_count != 1:
              raise SystemExit(f'Expected one compileSdk and minSdk assignment; got {compile_count}, {min_count}')
          text = '\n'.join(updated) + '\n'
          if 'isCoreLibraryDesugaringEnabled = true' not in text:
              if 'compileOptions {' not in text:
                  raise SystemExit('Generated Gradle file has no compileOptions block')
              text = text.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
          mlkit_dependencies = [
              'implementation("com.google.mlkit:text-recognition-chinese:16.0.1")',
              'implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")',
              'implementation("com.google.mlkit:text-recognition-japanese:16.0.1")',
              'implementation("com.google.mlkit:text-recognition-korean:16.0.1")',
          ]
          for mlkit_dependency in mlkit_dependencies:
              if mlkit_dependency not in text:
                  if 'dependencies {' in text:
                      text = text.replace('dependencies {', 'dependencies {\n    ' + mlkit_dependency, 1)
                  else:
                      text = text.rstrip() + '\n\ndependencies {\n    ' + mlkit_dependency + '\n}\n'
          if dependency not in text:
              if 'dependencies {' in text:
                  text = text.replace('dependencies {', 'dependencies {\n    ' + dependency, 1)
              else:
                  text = text.rstrip() + '\n\ndependencies {\n    ' + dependency + '\n}\n'
          build.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android.permission.CAMERA' not in text:
              text = text.replace('</manifest>', '    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>')
          if 'android:launchMode="singleTop"' in text:
              text = text.replace('android:launchMode="singleTop"', 'android:launchMode="singleTask"')
          if 'android.intent.action.SEND' not in text:
              share_filters = '''            <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="image/*" />
              </intent-filter>
              <intent-filter>
                  <action android:name="android.intent.action.SEND_MULTIPLE" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="image/*" />
              </intent-filter>
          '''
              text = text.replace('</activity>', share_filters + '        </activity>', 1)
          manifest.write_text(text)
          PY

      - name: Configure Apple camera permission
        if: matrix.target == 'ios' || matrix.target == 'macos'
        working-directory: app
        shell: bash
        run: |
          flutter pub get
          python3 - <<'PY'
          from pathlib import Path
          for raw in ['ios/Runner/Info.plist', 'macos/Runner/Info.plist']:
              p = Path(raw)
              if not p.exists():
                  continue
              s = p.read_text()
              if 'NSCameraUsageDescription' not in s:
                  s = s.replace('</dict>', '  <key>NSCameraUsageDescription</key>\n  <string>Snote uses the camera to scan note transfer QR codes.</string>\n</dict>')
              p.write_text(s)

          podfile = Path('ios/Podfile')
          if podfile.exists():
              lines = podfile.read_text().splitlines()
              found = False
              for index, line in enumerate(lines):
                  if line.strip().startswith('platform :ios,'):
                      lines[index] = "platform :ios, '15.5'"
                      found = True
              if not found:
                  lines.insert(0, "platform :ios, '15.5'")
              podfile.write_text('\n'.join(lines) + '\n')
          project_file = Path('ios/Runner.xcodeproj/project.pbxproj')
          if project_file.exists():
              lines = project_file.read_text().splitlines()
              lines = [line.split('IPHONEOS_DEPLOYMENT_TARGET =', 1)[0] + 'IPHONEOS_DEPLOYMENT_TARGET = 15.5;' if 'IPHONEOS_DEPLOYMENT_TARGET =' in line else line for line in lines]
              project_file.write_text('\n'.join(lines) + '\n')
          PY

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Clean
        working-directory: app
        run: flutter clean

      - name: Format
        working-directory: app
        run: dart format .

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Patch incompatible in-app webview ProGuard default
        if: matrix.target == 'android'
        working-directory: app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import site

          roots = [Path.home() / '.pub-cache' / 'hosted' / 'pub.dev']
          roots += [Path(p) / 'pub-cache' / 'hosted' / 'pub.dev' for p in site.getsitepackages()]
          changed = []
          for root in roots:
              if not root.exists():
                  continue
              for gradle in root.glob('flutter_inappwebview_android-*/android/build.gradle'):
                  content = gradle.read_text()
                  if "getDefaultProguardFile('proguard-android.txt')" in content:
                      gradle.write_text(content.replace("getDefaultProguardFile('proguard-android.txt')", "getDefaultProguardFile('proguard-android-optimize.txt')"))
                      changed.append(str(gradle))
          if changed:
              print('Patched legacy ProGuard default:', ', '.join(changed))
          else:
              print('No legacy ProGuard default found in cached plugin; continuing')
          PY

      - name: Test
        working-directory: app
        run: flutter test

      - name: Install web PDF assets
        if: matrix.target == 'web'
        working-directory: app
        run: dart run pdfx:install_web

      - name: Build Android
        if: matrix.target == 'android'
        working-directory: app
        shell: bash
        run: flutter build apk --release

      - name: Build Linux
        if: matrix.target == 'linux'
        working-directory: app
        shell: bash
        run: flutter build linux --release

      - name: Build Windows
        if: matrix.target == 'windows'
        working-directory: app
        shell: bash
        run: flutter build windows --release

      - name: Build macOS
        if: matrix.target == 'macos'
        working-directory: app
        shell: bash
        run: flutter build macos --release

      - name: Build iOS
        if: matrix.target == 'ios'
        working-directory: app
        shell: bash
        run: flutter build ios --release --no-codesign

      - name: Build Web
        if: matrix.target == 'web'
        working-directory: app
        shell: bash
        run: flutter build web --release

      - name: Package Android
        if: matrix.target == 'android'
        run: cp app/build/app/outputs/flutter-apk/app-release.apk Snote-Android.apk

      - name: Package Linux
        if: matrix.target == 'linux'
        run: tar -czf Snote-Linux.tar.gz -C app/build/linux/x64/release bundle

      - name: Package Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath Snote-Windows.zip

      - name: Package macOS
        if: matrix.target == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent app/build/macos/Build/Products/Release Snote-macOS.zip

      - name: Package iOS
        if: matrix.target == 'ios'
        run: ditto -c -k --sequesterRsrc --keepParent app/build/ios/iphoneos Snote-iOS-unsigned.zip

      - name: Package Web
        if: matrix.target == 'web'
        run: tar -czf Snote-Web.tar.gz -C app/build web

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' app/pubspec.yaml)
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Snote $VERSION" --generate-notes --latest
          fi