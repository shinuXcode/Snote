name: Snote Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true
      - name: Generate Windows files
        working-directory: app
        run: flutter create --platforms=windows --org=com.snote .
      - name: Verify and build
        working-directory: app
        run: |
          flutter pub get
          dart run launcher_icons
          flutter analyze
          flutter test
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: snote-windows
          path: app/build/windows/x64/runner/Release
