name: Snote Beta Build

on:
  push:
    branches:
      - feat/touchnotes-editor-overhaul
      - feat/snote-editor-engine-rebuild
      - feat/snote-beta79-nextgen
      - feat/snote-beta80-workspace-tools
      - feat/snote-beta81-tool-layout-fill
      - feat/snote-beta82-editor-polish-ocr
      - feat/snote-beta83-pro-ui-fountain-ocr
      - restore/oct14-beta92
      - feat/snote-beta96-workspace-overhaul
      - feat/writing-engine-touch-notes-refresh
    paths:
      - "app/**"
      - ".github/workflows/beta.yml"
  pull_request:
    branches:
      - restore/oct14-beta92
    paths:
      - "app/**"
      - ".github/workflows/beta.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Keep PR validation separate from the publishing push; otherwise the PR run cancels the APK release build.
  group: snote-beta-build-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  beta-android:
    name: Test and build Android beta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        name: Set up Flutter
        with:
          flutter-version: 3.47.3
          cache: true

      - name: Read beta version
        id: beta_version
        run: |
          set -euo pipefail
          VERSION="$(awk '/^version:/ {sub(/^version:[[:space:]]*/, ""); print; exit}' app/pubspec.yaml)"
          case "$VERSION" in
            1.1.0-beta.*+*) ;;
            *) echo "Unexpected beta version in app/pubspec.yaml: $VERSION"; exit 1 ;;
          esac
          RELEASE_VERSION="${VERSION%%+*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Snote beta $VERSION"

      - name: Generate Android runner
        working-directory: app
        run: |
          flutter create --platforms=android --org=com.snote --no-pub .
          mkdir -p android/app/src/main/kotlin/com/snote/snote
          cp native_android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp native_android/*.kt android/app/src/main/kotlin/com/snote/snote/
          rm -f test/widget_test.dart

      - name: Allow legacy ProGuard filename in Android WebView dependency
        working-directory: app
        run: |
          set -euo pipefail
          PROPERTIES="android/gradle.properties"
          mkdir -p android
          touch "$PROPERTIES"
          if grep -q '^android\.r8\.proguardAndroidTxt\.disallowed=' "$PROPERTIES"; then
            sed -i 's/^android\.r8\.proguardAndroidTxt\.disallowed=.*/android.r8.proguardAndroidTxt.disallowed=false/' "$PROPERTIES"
          else
            printf '\nandroid.r8.proguardAndroidTxt.disallowed=false\n' >> "$PROPERTIES"
          fi
          grep -Fx 'android.r8.proguardAndroidTxt.disallowed=false' "$PROPERTIES"
          echo "Applied AGP 9 compatibility setting for flutter_inappwebview_android 1.1.3."
      - name: Configure and verify Android beta identity
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build = Path('android/app/build.gradle.kts')
          if not build.is_file():
              raise SystemExit('Generated Android app/build.gradle.kts is missing')
          lines = build.read_text().splitlines()
          updated = []
          compile_count = 0
          min_count = 0
          for line in lines:
              stripped = line.strip()
              indent = line[:len(line) - len(line.lstrip())]
              if stripped.startswith('compileSdk ='):
                  line = indent + 'compileSdk = 37'
                  compile_count += 1
              elif stripped.startswith('minSdk ='):
                  line = indent + 'minSdk = 24'
                  min_count += 1
              if 'applicationId = "com.snote.snote"' in line:
                  line = line.replace('applicationId = "com.snote.snote"', 'applicationId = "com.snote.snote.beta"')
              updated.append(line)

          text = '\n'.join(updated) + '\n'
          if compile_count != 1:
              raise SystemExit(f'Expected one compileSdk assignment, found {compile_count}')
          if min_count != 1:
              raise SystemExit(f'Expected one minSdk assignment, found {min_count}')
          if 'compileSdk = 37' not in text:
              raise SystemExit('Android app module is not configured for compileSdk 37')
          if 'applicationId = "com.snote.snote.beta"' not in text:
              raise SystemExit('Could not set the separate beta application ID')
          build.write_text(text)
          print('Verified Android app module compileSdk=37, minSdk=24, applicationId=com.snote.snote.beta')

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if not manifest.is_file():
              raise SystemExit('Generated AndroidManifest.xml is missing')
          text = manifest.read_text()
          if 'android.permission.CAMERA' not in text:
              text = text.replace('</manifest>', '    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>')
          text = text.replace('android:label="snote"', 'android:label="Snote Beta"')
          if 'android:launchMode="singleTop"' in text:
              text = text.replace('android:launchMode="singleTop"', 'android:launchMode="singleTask"')
          if 'android.intent.action.SEND' not in text:
              share_filters = '''
                  <intent-filter>
                      <action android:name="android.intent.action.SEND" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="image/*" />
                  </intent-filter>
                  <intent-filter>
                      <action android:name="android.intent.action.SEND_MULTIPLE" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="image/*" />
                  </intent-filter>
              '''
              if '</activity>' not in text:
                  raise SystemExit('Could not find activity closing tag for Android share filters')
              text = text.replace('</activity>', share_filters + '\n            </activity>', 1)
          if 'android:authorities="${applicationId}.provider"' not in text:
              provider = '''
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.provider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/provider_paths" />
                  </provider>
              '''
              if '</application>' not in text:
                  raise SystemExit('Could not find application closing tag for clipboard image provider')
              text = text.replace('</application>', provider + '\n</application>', 1)
          manifest.write_text(text)

          provider_paths = Path('android/app/src/main/res/xml/provider_paths.xml')
          provider_paths.parent.mkdir(parents=True, exist_ok=True)
          if not provider_paths.is_file():
              provider_paths.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="external_files" path="." />
          </paths>
          ''')

          if 'Snote Beta' not in manifest.read_text():
              raise SystemExit('Beta app label was not set')
          if 'android.intent.action.SEND' not in manifest.read_text():
              raise SystemExit('Android image share filters were not configured')
          if 'android:authorities="${applicationId}.provider"' not in manifest.read_text():
              raise SystemExit('Clipboard image provider was not configured')
          if not provider_paths.is_file():
              raise SystemExit('Clipboard provider paths file is missing')
          PY

      - name: Verify maintained Android integration
        working-directory: app
        run: python3 ../.github/scripts/configure_beta_android.py
      - name: Configure optional ML Kit classes for release shrinking
        working-directory: app
        run: |
          set -euo pipefail
          cat > android/app/proguard-rules.pro <<'EOF'
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          EOF
          python3 - <<'PY'
          from pathlib import Path
          build = Path('android/app/build.gradle.kts')
          lines = build.read_text().splitlines()
          in_build_types = False
          in_release = False
          out = []
          configured = False
          for line in lines:
              stripped = line.strip()
              if stripped == 'buildTypes {':
                  in_build_types = True
              elif in_build_types and stripped == 'release {':
                  in_release = True
                  out.append(line)
                  indent = line[:len(line) - len(line.lstrip())] + '    '
                  if not any('proguard-rules.pro' in candidate for candidate in lines):
                      out.append(indent + 'isMinifyEnabled = true')
                      out.append(indent + 'proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")')
                  configured = True
                  continue
              elif in_release and stripped == '}':
                  in_release = False
              out.append(line)
          if not configured:
              raise SystemExit('Could not locate release build type in generated Gradle script')
          build.write_text(chr(10).join(out) + chr(10))
          print('Configured release R8 rules for optional ML Kit language recognizers.')
          PY
      - name: Enable Android core library desugaring for notifications
        working-directory: app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          text = path.read_text()
          if 'isCoreLibraryDesugaringEnabled = true' not in text:
              marker = 'compileOptions {'
              if marker not in text:
                  raise SystemExit('Generated Gradle file has no compileOptions block')
              text = text.replace(marker, marker + '\n        isCoreLibraryDesugaringEnabled = true', 1)
          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
          if dependency not in text:
              marker = 'dependencies {'
              if marker in text:
                  text = text.replace(marker, marker + '\n    ' + dependency, 1)
              else:
                  text = text.rstrip() + '\n\ndependencies {\n    ' + dependency + '\n}\n'
          path.write_text(text)
          assert 'isCoreLibraryDesugaringEnabled = true' in text
          assert dependency in text
          print('Enabled core library desugaring required by flutter_local_notifications.')
          PY

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Format
        working-directory: app
        run: dart format .

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: app
        run: flutter test --reporter expanded

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --no-shrink

      - name: Sign beta APK for Android installation
        run: |
          set -euo pipefail
          APK="app/build/app/outputs/flutter-apk/app-release.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$APKSIGNER"
          keytool -genkeypair -v \
            -keystore beta-signing.keystore \
            -storepass beta-temp-password \
            -keypass beta-temp-password \
            -alias snote-beta \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Snote Beta Test, OU=Beta, O=Snote, L=Katihar, ST=Bihar, C=IN"
          "$APKSIGNER" sign \
            --ks beta-signing.keystore \
            --ks-pass pass:beta-temp-password \
            --key-pass pass:beta-temp-password \
            --ks-key-alias snote-beta \
            --out Snote-Android-Beta.apk "$APK"
          "$APKSIGNER" verify --verbose --print-certs Snote-Android-Beta.apk
          rm -f beta-signing.keystore

      - name: Verify beta APK identity, signature and checksum
        env:
          EXPECTED_VERSION: ${{ steps.beta_version.outputs.release_version }}
        run: |
          set -euo pipefail
          APK="Snote-Android-Beta.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          APP_ID="$(printf '%s\n' "$BADGING" | awk -F"'" '/^package:/ {print $2; exit}')"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | grep '^package:' | grep -o "versionName='[^']*'" | cut -d"'" -f2)"
          test "$APP_ID" = "com.snote.snote.beta"
          test "$VERSION_NAME" = "$EXPECTED_VERSION"
          sha256sum "$APK" | awk '{print $1 "  Snote-Android-Beta.apk"}' > Snote-Android-Beta.sha256
          cat Snote-Android-Beta.sha256
          echo "Verified APK: applicationId=$APP_ID versionName=$VERSION_NAME"

      - name: Upload beta APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snote-android-beta-${{ steps.beta_version.outputs.release_version }}
          path: |
            Snote-Android-Beta.apk
            Snote-Android-Beta.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish beta prerelease
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.beta_version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.beta_version.outputs.release_version }}
          PACKAGE_VERSION: ${{ steps.beta_version.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="$(cat <<EOF
          Snote $PACKAGE_VERSION build for testing only.
          Build commit: $GITHUB_SHA
          This APK uses the separate Android application ID com.snote.snote.beta, so it can be installed alongside the stable Snote app without replacing it or touching stable app data.
          Published only after dependency resolution, formatting, analysis, automated tests, Android APK build, APK identity/version validation, and SHA-256 generation pass.
          EOF
          )"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" Snote-Android-Beta.apk Snote-Android-Beta.sha256 --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --title "Snote $PACKAGE_VERSION" --notes "$NOTES" --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" Snote-Android-Beta.apk Snote-Android-Beta.sha256 --repo "$GITHUB_REPOSITORY" --title "Snote $PACKAGE_VERSION" --notes "$NOTES" --target "$GITHUB_SHA" --prerelease
          fi

      - name: Remove superseded beta release after replacement publishes
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.beta_version.outputs.tag }}
        run: |
          set -euo pipefail
          OLD_TAG="v1.1.0-beta.79"
          if [ "$CURRENT_TAG" = "$OLD_TAG" ]; then
            echo "Skipping cleanup because the current release is the old beta."
            exit 0
          fi
          if gh release view "$OLD_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$OLD_TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
            echo "Removed superseded release and tag $OLD_TAG after $CURRENT_TAG was published."
          else
            echo "Superseded release $OLD_TAG is already absent."
          fi
