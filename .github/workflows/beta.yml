name: Snote Beta Build

on:
  push:
    branches:
      - feat/touchnotes-editor-redesign
    paths:
      - "app/**"
      - ".github/workflows/beta.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snote-beta-redesign
  cancel-in-progress: true

jobs:
  beta-android:
    name: Test and build Android beta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          cache: true

      - name: Generate Android runner
        working-directory: app
        run: |
          flutter create --platforms=android --org=com.snote .
          rm -f test/widget_test.dart

      - name: Configure Android
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          s = s.replace('applicationId = "com.snote.snote"', 'applicationId = "com.snote.snote.beta"')
         p.write_text(s)
         p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.CAMERA' not in s:
              s = s.replace('</manifest>', '    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>')
          import re
          s = re.sub(r'android:label="[^"]+"', 'android:label="Snote Beta"', s, count=1)
          p.write_text(s)
          PY

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Format check
        working-directory: app
        run: dart format .

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: app
        run: flutter test

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Rename beta APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk Snote-Android-Beta.apk

      - name: Upload beta APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snote-android-beta
          path: Snote-Android-Beta.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish beta prerelease
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-beta.${{ github.run_number }}
          name: Snote 1.1 Beta ${{ github.run_number }}
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: Snote-Android-Beta.apk
          body: |
            Snote 1.1 beta build for testing only.
            This is a prerelease build from the editor redesign branch. It is separate from the stable production release.
            Test stylus live ink, lasso selection and transforms, page templates, page navigation, persistence, and report any issues before stable release.
