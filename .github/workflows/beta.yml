        working-directory: app
        run: flutter pub get

      - name: Format
        working-directory: app
        run: dart format .

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: app
        run: flutter test

      # This job builds Android only. pdfx:install_web needs web/index.html
      # and is intentionally run by the separate Web build workflow instead.

      - name: Build release APK
        working-directory: app
