name: Snote Beta Build

on:
  push:
    branches:
      - feat/touchnotes-editor-overhaul
    paths:
      - "app/**"
      - ".github/workflows/beta.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snote-beta-build
  cancel-in-progress: true

jobs:
  beta-android:
    name: Test and build Android beta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          cache: true

      - name: Generate Android runner
        working-directory: app
        run: |
          flutter create --platforms=android --org=com.snote .
          rm -f test/widget_test.dart

      - name: Configure Android
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          p.write_text(s)
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.CAMERA' not in s:
              s = s.replace('</manifest>', '    <uses-permission android:name="android.permission.CAMERA" />\\n</manifest>')
          p.write_text(s)
          PY

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Format
        working-directory: app
        run: dart format .

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: app
        run: flutter test

      - name: Configure PDF.js web assets
        working-directory: app
        run: dart run pdfx:install_web

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Rename beta APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk Snote-Android-Beta.apk

      - name: Upload beta APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snote-android-beta
          path: Snote-Android-Beta.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish beta prerelease
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-beta.${{ github.run_number }}
          name: Snote 1.1 Beta ${{ github.run_number }}
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: Snote-Android-Beta.apk
          body: |
            Snote 1.1 beta build for testing only.
            This is a prerelease from the TouchNotes-inspired editor overhaul branch, separate from the stable production release.
            Please test live stylus ink, scientific shape palettes, lasso/selection, templates, page navigation, and persistence.
