        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-beta.42
          name: Snote 1.1 Beta 42
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: Snote-Android-Beta.apk
          body: |
