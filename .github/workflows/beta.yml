        run: cp app/build/app/outputs/flutter-apk/app-release.apk Snote-Android-Beta.apk

      - name: Upload beta APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snote-android-beta
          path: Snote-Android-Beta.apk
          if-no-files-found: error
          retention-days: 30

