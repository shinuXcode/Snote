name: Snote Beta Build

on:
  push:
    branches:
      - feat/touchnotes-editor-redesign
    paths:
      - "app/**"
      - ".github/workflows/beta.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snote-beta-redesign
  cancel-in-progress: true

jobs:
  beta-android:
    name: Test and build Android beta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          cache: true

      - name: Generate Android runner
        working-directory: app
        run: |
          flutter create --platforms=android --org=com.snote .
          rm -f test/widget_test.dart

      - name: Configure Android
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
          text = text.replace(
              'applicationId = "com.snote.snote"',
              'applicationId = "com.snote.snote.beta"',
          )
          if 'applicationId = "com.snote.snote.beta"' not in text:
              raise SystemExit('Could not set the separate beta application ID')
          gradle.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android.permission.CAMERA' not in text:
              text = text.replace(
                  '</manifest>',
                  '    <uses-permission android:name="android.permission.CAMERA" />' + chr(10) + '</manifest>',
              )
          text = re.sub(r'android:label="[^"]+"', 'android:label="Snote Beta"', text, count=1)
          manifest.write_text(text)
          PY

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Format check
        working-directory: app
        run: dart format .

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: app
        run: flutter test

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Rename beta APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk Snote-Android-Beta.apk

      - name: Upload beta APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: snote-android-beta
          path: Snote-Android-Beta.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish beta prerelease
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-beta.${{ github.run_number }}
          name: Snote 1.1 Beta ${{ github.run_number }}
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: Snote-Android-Beta.apk
          body: |
            Snote 1.1 beta build for testing only.
            This APK uses a separate Android application ID so it can be tested alongside stable Snote.
            Test stylus live ink, lasso selection and transforms, page templates, scientific shapes, and persistence before stable release.
