name: Snote Diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        continue-on-error: true
        with:
          flutter-version: 3.47.6
          cache: true

      - name: Capture Flutter diagnostics
        shell: bash
        run: |
          mkdir -p ci
          set +e
          {
            echo "=== flutter path ==="
            command -v flutter || true
            echo "=== flutter version ==="
            flutter --version
            echo "=== create ==="
            cd app
            flutter create --platforms=android --org=com.snote .
            echo "create_status=$?"
            echo "=== pub get ==="
            flutter pub get
            echo "pub_get_status=$?"
            echo "=== icons ==="
            dart run launcher_icons
            echo "icons_status=$?"
            echo "=== analyze ==="
            flutter analyze
            echo "analyze_status=$?"
            echo "=== test ==="
            flutter test
            echo "test_status=$?"
            echo "=== apk ==="
            flutter build apk --release
            echo "build_status=$?"
          } 2>&1 | tee ../ci/flutter.log
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snote-flutter-diagnostics
          path: ci/flutter.log
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Capture website diagnostics
        shell: bash
        run: |
          mkdir -p ci
          set +e
          {
            cd website
            echo "=== npm install ==="
            npm install
            echo "npm_install_status=$?"
            echo "=== typecheck ==="
            npm run typecheck
            echo "typecheck_status=$?"
            echo "=== build ==="
            npm run build
            echo "next_build_status=$?"
          } 2>&1 | tee ../ci/website.log
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snote-website-diagnostics
          path: ci/website.log
          if-no-files-found: error
