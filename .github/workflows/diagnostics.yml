name: Snote Diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true

      - name: Generate platform
        working-directory: app
        run: flutter create --platforms=android --org=com.snote .

      - name: Verify Flutter
        working-directory: app
        shell: bash
        run: |
          set +e
          {
            echo "=== flutter --version ==="
            flutter --version
            echo "=== pub get ==="
            flutter pub get
            GET_STATUS=$?
            echo "pub_get_status=$GET_STATUS"
            echo "=== launcher icons ==="
            dart run launcher_icons
            ICON_STATUS=$?
            echo "launcher_icons_status=$ICON_STATUS"
            echo "=== analyze ==="
            flutter analyze
            ANALYZE_STATUS=$?
            echo "analyze_status=$ANALYZE_STATUS"
            echo "=== tests ==="
            flutter test
            TEST_STATUS=$?
            echo "test_status=$TEST_STATUS"
            echo "=== build ==="
            flutter build apk --release
            BUILD_STATUS=$?
            echo "build_status=$BUILD_STATUS"
            printf "RESULT get=%s icon=%s analyze=%s test=%s build=%s\n" "$GET_STATUS" "$ICON_STATUS" "$ANALYZE_STATUS" "$TEST_STATUS" "$BUILD_STATUS"
            exit 0
          } 2>&1 | tee ../flutter-ci.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snote-flutter-diagnostics
          path: app/../flutter-ci.log
          if-no-files-found: error
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify website
        shell: bash
        run: |
          set +e
          {
            npm install
            echo "npm_install_status=$?"
            npm run typecheck
            echo "typecheck_status=$?"
            npm run build
            echo "next_build_status=$?"
            exit 0
          } 2>&1 | tee ../website-ci.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snote-website-diagnostics
          path: website/../website-ci.log
          if-no-files-found: error
