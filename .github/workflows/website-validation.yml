name: Snotee Website Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-validation.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snotee-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run typecheck
      - name: Design guard and Next.js production build
        run: npm run build
