name: snote
description: Open-source offline-first handwriting and rich-text notes.
publish_to: "none"
version: 0.1.0+1
environment:
  sdk: ">=3.12.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.0
  sqflite_common_ffi_web: ^1.2.0
  path: ^1.9.1
  path_provider: ^2.1.5
  supabase_flutter: ^2.15.0
  local_auth: ^2.3.0
  connectivity_plus: ^7.0.0
  uuid: ^4.5.1
  file_picker: ^10.3.10
  share_plus: ^12.0.1
  image_picker: ^1.2.1
  qr_flutter: ^4.1.0
  pdfx: ^2.9.2
  flutter_quill: ^11.5.0
  flutter_secure_storage: ^9.2.4
  http: ^1.6.0
  collection: ^1.19.1
  intl: ^0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
