name: snote
description: Open-source offline-first handwriting and rich-text notes.
publish_to: "none"
version: 0.8.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.3.0
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.3
  sqflite_common_ffi_web: ^1.1.3
  path: ^1.9.1
  path_provider: ^2.1.6
  supabase_flutter: ^2.18.0
  connectivity_plus: ^7.3.2
  uuid: ^4.5.1
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  image_picker: ^1.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  pdfx: ^2.11.0
  flutter_quill: ^11.5.1
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.6
  archive: ^4.3.0
  wakelock_plus: ^1.8.1
  http: ^1.6.0
  collection: ^1.19.1
  url_launcher: ^6.3.3
  intl: ^0.20.3
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  launcher_icons: ^0.16.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

launcher_icons:
  image_path: assets/branding/snote-logo.svg
  android:
    generate: true
  ios:
    generate: true
  macos:
    generate: true
  windows:
    generate: true
  linux:
    generate: true
  web:
    generate: true