name: snote
description: Open-source offline-first handwriting and rich-text notes.
publish_to: "none"
version: 0.1.2+3

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.3
  sqflite_common_ffi_web: ^1.1.3
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.5.1
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  image_picker: ^1.2.1
  pasteboard: ^0.5.0
  receive_sharing_intent: ^1.9.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  pdf: ^3.12.0
  pdfx: ^2.11.0
  flutter_quill: ^11.5.1
  google_mlkit_text_recognition: ^0.15.0
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.6
  archive: ^4.0.9
  wakelock_plus: ^1.8.1
  http: ^1.6.0
  url_launcher: ^6.3.3
  flutter_inappwebview: ^6.1.5
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.0.1
  intl: ^0.20.3
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: assets/branding/snote-logo.png
  adaptive_icon_background: '#101216'
  adaptive_icon_foreground: assets/branding/snote-logo.png
  adaptive_icon_monochrome: assets/branding/snote-logo.png
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
