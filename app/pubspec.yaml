name: snote
description: Open-source offline-first handwriting and rich-text notes.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.3.0
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.0
  sqflite_common_ffi_web: ^1.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  supabase_flutter: ^2.18.0
  local_auth: ^3.0.2
  connectivity_plus: ^7.3.2
  uuid: ^4.5.1
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  image_picker: ^1.2.1
  qr_flutter: ^4.1.0
  pdfx: ^2.9.2
  flutter_quill: ^11.4.2
  flutter_secure_storage: ^9.2.4
  http: ^1.6.0
  collection: ^1.19.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  launcher_icons: ^0.16.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

launcher_icons:
  image_path: assets/branding/snote-logo.svg
  android:
    generate: true
  ios:
    generate: true
  macos:
    generate: true
  windows:
    generate: true
  linux:
    generate: true
  web:
    generate: true
