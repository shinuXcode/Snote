name: snote
description: Open-source offline-first handwriting and rich-text notes.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  path_provider: ^2.1.5
  supabase_flutter: ^2.8.0
  local_auth: ^2.3.0
  connectivity_plus: ^6.1.2
  uuid: ^4.5.1
  file_picker: ^8.3.7
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  pdfx: ^2.8.0
  flutter_quill: ^11.4.2
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  collection: ^1.19.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
