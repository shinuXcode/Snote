name: snote_screen_capture
description: In-memory MediaProjection screen capture for Snote.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.snote.snote_screen_capture
        pluginClass: SnoteScreenCapturePlugin
